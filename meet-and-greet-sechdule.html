<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch&family=Slackey&display=swap" rel="stylesheet">
    <title>Meet and Greet - Bark Twain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --container-w: 743.17px;
            --img-max: 100px;
        }

          
        body {
            font-family: 'Chakra Petch', monospace;
            background-image: url('fabric_background.png');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            color: #4a3728;
            padding: 120px 0 80px 0;
        }

        .container {
            max-width: 1500px;
            max-height: 2311px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .pet-header {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
            align-items: flex-start;
        }

        .pet-image {
            width: 217.67px;
            height: 183px;
            border-radius: 45px;
            object-fit: cover;
            border: 2.5px solid #3d2f1f;
            background: #888;
        }

        .pet-info {
            flex: 0 0 auto;
            width: 122px;
            height: 124px;
        }

        .pet-info h2 {
            font-size: 23px;
            margin-bottom: 2px;
            font-weight: semibold;
            color: #3d2f1f;
        }

        .pet-info p {
            font-size: 24px;
            color: #5a4a3a;
            line-height: 1.3;
        }

        .header-section {
            display: flex;
            
            align-items: flex-start;
            gap: 40px;
            
            margin: 0 auto 20px;
            width: min(1221.17px, 100%);
            height: min(190px, 100%);
            max-width: 1221.17px;
            max-height: 190px;
        }

    .progress-tracker {
            display: flex;
            
            position: relative;
            
            --pc-size: 100px; 
            
            width: min(743.17px, 100%);
            
            height: min(176px, calc(var(--pc-size) + 76px));
                
                
                justify-content: flex-end;
                margin-left: auto; 
                padding-right: 0;
                
                gap: 0;
            align-items: flex-start; 

        }

        
        .progress-connector {
            
            
            flex: 1 2 min(109px, max(6px, calc((100% - (4 * var(--pc-size))) / 3)));
            display: flex;
            align-items: center; 
            justify-content: center;
            
            width: min(109px, max(6px, calc((100% - (4 * var(--pc-size))) / 3)));
            height: var(--pc-size);
            min-width: 6px; 
            z-index: -1; 
            overflow: hidden; 
        }
        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            
                
                flex: 0 1 var(--pc-size);
                min-width: 0; 
                
                width: var(--pc-size);
                
                height: var(--pc-size);
            box-sizing: border-box;
            margin: 0;
            padding: 0;
                text-align: center; 
                position: relative; 
            z-index: 2;
        }

          
          .progress-meta {
                position: absolute;
                top: calc(var(--pc-size) + 6px); 
                left: 50%;
                transform: translateX(-50%);
                width: var(--pc-size);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                box-sizing: border-box;
                text-align: center;
                z-index: 2;
          }

        
        .progress-step > * {
            margin-left: auto;
            margin-right: auto;
        }

        .progress-circle {
            
            width: var(--pc-size);
            height: var(--pc-size);
            border-radius: 50%;
            background: rgba(209, 196, 160, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            
            flex: 0 1 var(--pc-size);
            min-width: 48px; 
            aspect-ratio: 1 / 1;
        }

        
        .progress-circle svg,
        .progress-circle img.progress-icon {
            width: 100%;
            height: 100%;
            display: block;
        }

        .progress-circle img.progress-icon {
            object-fit: contain;
        }

        
        @media (max-width: 900px) {
            
            .progress-tracker { --pc-size: 50px; }
        }

        @media (max-width: 480px) {
            .progress-tracker { --pc-size: 44px; }
        }

        .progress-step.active .progress-circle {
            background: rgba(203, 202, 120, 0.489);
        }

        
        .progress-column {
            display: flex;
            flex-direction: column;
            
            align-items: flex-end; 
            
            align-self: flex-start;
            
            justify-content: flex-start;
            
            margin-top: 0;
            padding-top: 0;
            width: 100%;
            gap: 8px;
            flex: 1 1 auto; ;
        }

        .progress-label {
            font-size: clamp(10px, 16px, 16px);
            text-align: center;
            line-height: 1.2;
            color: #4a3728;
            margin-top: 2px;
            display: block;
            box-sizing: border-box;
            min-height: 38.4px;
        }

        
        .progress-label,
        .progress-date {
            
            width: var(--pc-size);
            box-sizing: border-box;
            min-height: 1.2em; 
            white-space: normal; 
            overflow-wrap: anywhere;
            word-break: break-word;
            text-align: center;
        }

        .progress-date {
            color: #6b5d4f;
            
            min-height: 16px;
            text-align: center;
            font-size: clamp(10px, 12px, 14px);

        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 0 40px;
        }

            
            .set-details-container {
                width: min(654px, 100%);
                max-width: 654px;
                min-height: 627px; 
                margin: 18px auto 40px; 
                padding: 22px; 
                box-sizing: border-box;
                background: rgba(193, 192, 150, 0.354);
                border: 1px solid rgba(0, 0, 0, 0.354);
                border-radius: 50px;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }

            .set-title {
                width: min(283px, 100%);
                height: min(34px, auto);
                margin: 0 auto; 
                font-family: 'Slackey', sans-serif;
                font-size: 24px;
                color: #6b4423;
                text-align: center;
                line-height: 34px;
            }

            .set-details-grid {
                display: flex;
                flex-direction: column;
                gap: 20px;
                padding: 6px 4px;
                align-items: flex-start; 
                width: 100%;
                box-sizing: border-box;
                flex: 1 1 auto;
                margin-top: 10px;
            }

            .detail-row {
                display: flex;
                gap: 12px;
                align-items: center;
                width: 100%;
                box-sizing: border-box;
            }

            
            .detail-row--top { align-items: flex-start; }

            .detail-row label {
                font-family: "Slackey";
            }

            
            .detail-input {
                width: min(449px, 100%);
                max-width: 449px;
                
                height: 57px;
                max-height: 57px;
                padding: 10px 12px;
                border-radius: 27px;
                border: 1px solid rgba(61,47,31,0.32);
                background: rgba(255,255,255,0);
                font-family: inherit;
                font-size: 16px;
                color: #3d2f1f;
                box-sizing: border-box;
                flex: 1 1 auto;
            }

            .detail-label {
                width: min(133px, 100%);
                max-width: 133px;
                height: min(34px, auto);
                font-size: 24px;
                font-family: 'Splackey';
                color: #3d2f1f;
                text-align: left;
                box-sizing: border-box;
                flex: 0 0 auto;
            }

            .detail-textarea {
                width: min(449px, 100%);
                max-width: 449px;
                
                height: min(198px, 60vh);
                max-height: 449px;
                min-height: 120px;
                padding: 12px;
                border-radius: 27px;
                border: 1px solid rgba(61,47,31,0.32);
                background: rgba(255,255,255,0);
                font-family: inherit;
                font-size: 15px;
                color: #3d2f1f;
                box-sizing: border-box;
                resize: vertical;
            }

            .set-actions {
                display: flex;
                justify-content: flex-end;
                width: 100%;
                box-sizing: border-box;
                padding-top: 0px;
                margin-top: 6px; 
                margin-bottom: 20px;
            }

            .btn {
                font-family: inherit;
                font-size: 24px;
                padding: 12px 20px;
                border-radius: 28px;
                border: 1px solid rgba(61,47,31,0.32);
                background: #bd919100;
                color: #3d2f1f;
                cursor: pointer;
                transition: background 160ms ease, transform 120ms ease, border-color 120ms ease;
            }

            .btn-primary {
                background: #867b5b5c;
                color: #4a3728;
                width: min(268px, 100%);
                max-width: 268px;
                height: min(61px, auto);
                max-height: 61px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }

            .btn:hover { transform: translateY(-2px); }
            .btn-primary:hover { background: #2f2316; }

            
            @media (max-width: 700px) {
                .detail-row { flex-direction: column; align-items: stretch; }
                .detail-label { max-width: 100%; width: 100%; }
                .detail-input, .detail-textarea { max-width: 100%; width: 100%; }
                .set-details-container { padding: 16px; min-height: auto; }
                .btn-primary { width: 100%; max-width: none; }
                .detail-textarea { height: min(360px, 45vh); max-height: 45vh; }
            }

    </style>
</head>
<body>
    <div class="container">
        <!-- Space for header, pet info, and progress tracker -->
        
        <div class="header-section">
            <div class="pet-header">
                <div class="pet-image"></div>
                <div class="pet-info">
                    <h2>Bark Twain</h2>
                    <p>Beagle</p>
                    <p>2 yrs. old</p>
                    <p>Male</p>
                </div>
            </div>
            <div class="progress-column">
                <div class="progress-tracker">
                    <div class="progress-step active">
                        <div class="progress-circle">
                            <img src="svgs/application_placed.svg" alt="Application Placed" class="progress-icon">
                        </div>
                        <div class="progress-meta">
                            <div class="progress-label">Application Placed</div>
                            <div class="progress-date">October 28, 2025</div>
                        </div>
                    </div>
                    <div class="progress-connector">
                        <svg width="100%" height="2" viewBox="0 0 100 2" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                            <line x1="0" x2="100" y1="1" y2="1" stroke="#3d2f1f" stroke-width="1" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="progress-step active">
                        <div class="progress-circle">
                            <img src="svgs/meet_and_greet.svg" alt="Meet and Greet" class="progress-icon">
                        </div>
                        <div class="progress-meta">
                            <div class="progress-label">Meet and Greet</div>
                            <div class="progress-date"></div>
                        </div>
                    </div>
                    <div class="progress-connector">
                        <svg width="100%" height="2" viewBox="0 0 100 2" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                            <line x1="0" x2="100" y1="1" y2="1" stroke="#3d2f1f" stroke-width="1" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="progress-step">
                        <div class="progress-circle">
                            <img src="svgs/ready_for_adoption.svg" alt="Ready for Adoption" class="progress-icon">
                        </div>
                        <div class="progress-meta">
                            <div class="progress-label">Ready for Adoption</div>
                            <div class="progress-date"></div>
                        </div>

                    </div>
                    <div class="progress-connector">
                        <svg width="100%" height="2" viewBox="0 0 100 2" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                            <line x1="0" x2="100" y1="1" y2="1" stroke="#3d2f1f" stroke-width="1" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="progress-step">
                        <div class="progress-circle">
                            <img src="svgs/adopted.svg" alt="Adopted" class="progress-icon">
                        </div>
                        <div class="progress-meta">
                            <div class="progress-label">Adopted      </div>
                            <div class="progress-date"></div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div class="set-details-container">
            <div class="set-title">Set Meet and Greet</div>

            <div class="set-details-grid">
                <div class="detail-row">
                    <label class="detail-label" for="meet-date">Date:</label>
                    <input type="text" class="detail-input" id="meet-date" placeholder="Select date" aria-label="Date">
                </div>

                <div class="detail-row">
                    <label class="detail-label" for="meet-time">Time:</label>
                    <input type="text" class="detail-input" id="meet-time" placeholder="Select time" aria-label="Time">
                </div>

                <div class="detail-row">
                    <label class="detail-label" for="meet-location">Location:</label>
                    <input type="text" class="detail-input" id="meet-location" placeholder="Location" aria-label="Location">
                </div>

                <div class="detail-row detail-row--top">
                    <label class="detail-label" for="meet-message">Message:</label>
                    <textarea class="detail-textarea" id="meet-message" placeholder="Message" aria-label="Message"></textarea>
                </div>
            </div>

            <div class="set-actions">
                <button type="button" class="btn btn-primary">Send Schedule</button>
            </div>
        </div>

        <!-- Space for footer -->
    </div>
</body>
</html>
