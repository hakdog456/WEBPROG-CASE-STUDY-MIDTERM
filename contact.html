<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurassic Bark | Contact Us</title>
    <link rel="stylesheet" href="contact.css">
    <script src="https://kit.fontawesome.com/a2e0ad8c1a.js" crossorigin="anonymous"></script>
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Slackey&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=League+Spartan:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>

    <!-- Navbar -->
    <nav class="navbar">
      <div class="logo">
        <a href="index.html"><img src="images/homeImages/Jurassic Bark.webp" alt="Jurassic Bark logo"></a>
      </div>

      <!-- mobile toggle -->
      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true">
      <label for="nav-toggle" class="menu-btn" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </label>

      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Our Animals</a></li>
        <li><a href="#">Contact Us</a></li>
        <li><a href="faqs.html" target="_blank">FAQs</a></li>
      </ul>

      <div class="icons">
        <img src="images/homeImages/search.svg" alt="search" class="icon" />
        <img src="images/homeImages/user.svg" alt="user" class="icon" />
      </div>
    </nav>

    <!-- Contact Section -->
    <section class="contact-section">
      <div class="contact-container">
        <div class="contact-image">
          <img src="images/Dogs image contact.png" alt="Dog background">
        </div>
        <div class="contact-form">
          <h2>Contact us!</h2>
          <form>
            <label>Name:</label>
            <input type="text" required>

            <label>Email:</label>
            <input type="email" required>

            <label>Subject:</label>
            <input type="text">

            <label>Message:</label>
            <textarea rows="4"></textarea>

            <div class="bottom-row">
              <p class="call">or call 0912-345-6789</p>
              <button type="submit" class="submit">Send Message</button>
            </div>


          </form>
        </div>
      </div>
    </section>

    <!-- Insert Footer -->
    

  </body>
</html>
