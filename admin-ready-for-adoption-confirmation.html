<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch&family=Slackey&display=swap" rel="stylesheet">
    <title>Meet and Greet - Bark Twain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --container-w: 743.17px;
            --img-max: 100px;
        }

          
        body {
            font-family: 'Chakra Petch', monospace;
            background-image: url('fabric_background.png');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            color: #4a3728;
            padding: 120px 0 80px 0;
        }

        .container {
            max-width: 1500px;
            max-height: 2311px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .pet-header {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
            align-items: flex-start;
        }

        .pet-image {
            width: 217.67px;
            height: 183px;
            border-radius: 45px;
            object-fit: cover;
            border: 2.5px solid #3d2f1f;
            background: #888;
        }

        .pet-info {
            flex: 0 0 auto;
            width: 122px;
            height: 124px;
        }

        .pet-info h2 {
            font-size: 23px;
            margin-bottom: 2px;
            font-weight: semibold;
            color: #3d2f1f;
        }

        .pet-info p {
            font-size: 24px;
            color: #5a4a3a;
            line-height: 1.3;
        }

        .header-section {
            display: flex;
            
            align-items: flex-start;
            gap: 40px;
            
            margin: 0 auto 20px;
            width: min(1221.17px, 100%);
            height: min(190px, 100%);
            max-width: 1221.17px;
            max-height: 190px;
        }

    .progress-tracker {
            display: flex;
            
            position: relative;
            
            --pc-size: 100px; 
            
            width: min(743.17px, 100%);
            
            height: min(176px, calc(var(--pc-size) + 76px));
                
                
                justify-content: flex-end;
                margin-left: auto; 
                padding-right: 0;
                
                gap: 0;
            align-items: flex-start; 

        }

        
        .progress-connector {
            
            
            flex: 1 2 min(109px, max(6px, calc((100% - (4 * var(--pc-size))) / 3)));
            display: flex;
            align-items: center; 
            justify-content: center;
            
            width: min(109px, max(6px, calc((100% - (4 * var(--pc-size))) / 3)));
            height: var(--pc-size);
            min-width: 6px; 
            z-index: -1; 
            overflow: hidden; 
        }
        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            
                
                flex: 0 1 var(--pc-size);
                min-width: 0; 
                
                width: var(--pc-size);
                
                height: var(--pc-size);
            box-sizing: border-box;
            margin: 0;
            padding: 0;
                text-align: center; 
                position: relative; 
            z-index: 2;
        }

          
          .progress-meta {
                position: absolute;
                top: calc(var(--pc-size) + 6px); 
                left: 50%;
                transform: translateX(-50%);
                width: var(--pc-size);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                box-sizing: border-box;
                text-align: center;
                z-index: 2;
          }

        
        .progress-step > * {
            margin-left: auto;
            margin-right: auto;
        }

        .progress-circle {
            
            width: var(--pc-size);
            height: var(--pc-size);
            border-radius: 50%;
            background: rgba(209, 196, 160, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            
            flex: 0 1 var(--pc-size);
            min-width: 48px; 
            aspect-ratio: 1 / 1;
        }

        
        .progress-circle svg,
        .progress-circle img.progress-icon {
            width: 100%;
            height: 100%;
            display: block;
        }

        .progress-circle img.progress-icon {
            object-fit: contain;
        }

        
        @media (max-width: 900px) {
            
            .progress-tracker { --pc-size: 50px; }
        }

        @media (max-width: 480px) {
            .progress-tracker { --pc-size: 44px; }
        }

        .progress-step.active .progress-circle {
            background: rgba(203, 202, 120, 0.489);
        }

        
        .progress-column {
            display: flex;
            flex-direction: column;
            
            align-items: flex-end; 
            
            align-self: flex-start;
            
            justify-content: flex-start;
            
            margin-top: 0;
            padding-top: 0;
            width: 100%;
            gap: 8px;
            flex: 1 1 auto; ;
        }

        .progress-label {
            font-size: clamp(10px, 16px, 16px);
            text-align: center;
            line-height: 1.2;
            color: #4a3728;
            margin-top: 2px;
            display: block;
            box-sizing: border-box;
            min-height: 38.4px;
        }

        
        .progress-label,
        .progress-date {
            
            width: var(--pc-size);
            box-sizing: border-box;
            min-height: 1.2em; 
            white-space: normal; 
            overflow-wrap: anywhere;
            word-break: break-word;
            text-align: center;
        }

        .progress-date {
            color: #6b5d4f;
            
            min-height: 16px;
            text-align: center;
            font-size: clamp(10px, 12px, 14px);

        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 0 40px;
        }


        .admin-ready-final-container {
            background: rgba(193, 192, 150, 0.354);
            border: 1px solid rgba(0, 0, 0, 0.354);
            padding: 25px 15px 35px 50px;
            border-radius: 50px;
            position: relative;
            width: min(1262px, 100%);
            margin: 0 auto;
            max-height: 1262px;
            max-width: 1262px;
            height: min(212px, 100%);
        }

        .section-title {
            text-align: center;
            font-size: 23px;
            margin-bottom: 10px;
            color: #6b4423;
            font-weight: 400;
            letter-spacing: 0.5px;;
            font-family: "Slackey";
        }

        .verify-text {
            font-size: 36px;
            color: #4a3728;
            margin-top: 20px;
            margin-bottom: 40px;
            text-align: center;
        }

        .form-actions-wrapper {
            width: min(1262px, 100%);
            max-width: 1262px;
            margin: 18px auto 0; 
            box-sizing: border-box;
            padding: 0 15px; 
        }

        .form-actions {
            display: flex;
            justify-content: flex-end; 
            gap: 12px;
            align-items: center;
        }

        .btn {
            font-family: inherit;
            font-size: 24px;
            padding: 10px 22px;
            border-radius: 100px;
            border: 1.5px solid #3d2f1f;
            background: rgba(163, 136, 107, 0.271);
            color: #3d2f1f;
            cursor: pointer;
            transition: background 160ms ease, border-color 120ms ease, color 120ms ease, transform 120ms ease;
            width: min(193px, 100%);
            height: min(61px, 100%);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            color: #3d2f1f;
            border-color: #3d2f1f;
        }


        .btn-secondary {
            background: #a46345cb;
            color: #3d2f1f;
            border-color: #3d2f1f;
        }

        .btn-primary:hover {
            background: rgba(32, 27, 21, 0.271);
        }

        .btn-secondary:hover {
            background: rgba(135, 74, 46, 0.9); 
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Space for header, pet info, and progress tracker -->
        
        <div class="header-section">
            <div class="pet-header">
                <div class="pet-image"></div>
                <div class="pet-info">
                    <h2>Bark Twain</h2>
                    <p>Beagle</p>
                    <p>2 yrs. old</p>
                    <p>Male</p>
                </div>
            </div>
            <div class="progress-column">
                <div class="progress-tracker">
                    <div class="progress-step active">
                        <div class="progress-circle">
                            <img src="svgs/application_placed.svg" alt="Application Placed" class="progress-icon">
                        </div>
                        <div class="progress-meta">
                            <div class="progress-label">Application Placed</div>
                            <div class="progress-date">October 20, 2025</div>
                        </div>
                    </div>
                    <div class="progress-connector">
                        <svg width="100%" height="2" viewBox="0 0 100 2" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                            <line x1="0" x2="100" y1="1" y2="1" stroke="#3d2f1f" stroke-width="1" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="progress-step active">
                        <div class="progress-circle">
                            <img src="svgs/meet_and_greet.svg" alt="Meet and Greet" class="progress-icon">
                        </div>
                        <div class="progress-meta">
                            <div class="progress-label">Meet and Greet</div>
                            <div class="progress-date">October 22, 2025</div>
                        </div>
                    </div>
                    <div class="progress-connector">
                        <svg width="100%" height="2" viewBox="0 0 100 2" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                            <line x1="0" x2="100" y1="1" y2="1" stroke="#3d2f1f" stroke-width="1" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="progress-step active">
                        <div class="progress-circle">
                            <img src="svgs/ready_for_adoption.svg" alt="Ready for Adoption" class="progress-icon">
                        </div>
                        <div class="progress-meta">
                            <div class="progress-label">Ready for Adoption</div>
                            <div class="progress-date">October 25, 2025</div>
                        </div>

                    </div>
                    <div class="progress-connector">
                        <svg width="100%" height="2" viewBox="0 0 100 2" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                            <line x1="0" x2="100" y1="1" y2="1" stroke="#3d2f1f" stroke-width="1" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="progress-step">
                        <div class="progress-circle">
                            <img src="svgs/adopted.svg" alt="Adopted" class="progress-icon">
                        </div>
                        <div class="progress-meta">
                            <div class="progress-label">Adopted      </div>
                            <div class="progress-date"></div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <div class="admin-ready-final-container">
            <h3 class="section-title">Adoption Confirmation</h3>

            <p class="verify-text">
                Verify and approve Bark Twain's adoption to [name]?
            </p>
        </div>

        <div class="form-actions-wrapper">
            <div class="form-actions">
                <button type="button" class="btn btn-primary">Approve</button>
                <button type="button" class="btn btn-secondary">Reject</button>
            </div>
        </div>

        <!-- Space for footer -->
    </div>
</body>
</html>
