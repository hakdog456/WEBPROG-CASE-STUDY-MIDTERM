<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch&family=Slackey&display=swap" rel="stylesheet">

    <title>Payment - Bark Twain Adoption</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --container-w: 743.17px;
            --img-max: 100px;
        }

          
        body {
            font-family: 'Chakra Petch', monospace;
            background-image: url('fabric_background.png');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            color: #4a3728;
            padding: 120px 0 80px 0;
        }

        .container {
            
            
            max-width: 1302px;
            max-height: 2311px;
            margin: 0 auto;
            
            padding: 0 20px;
        }

        .pet-header {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
            align-items: flex-start;
        }

        .pet-image {
            width: 217.67px;
            height: 183px;
            border-radius: 45px;
            object-fit: cover;
            border: 2.5px solid #3d2f1f;
            background: #888;
        }

        .pet-info {
            flex: 0 0 auto;
            width: 122px;
            height: 124px;
        }

        .pet-info h2 {
            font-size: 23px;
            margin-bottom: 2px;
            font-weight: semibold;
            color: #3d2f1f;
        }

        .pet-info p {
            font-size: 24px;
            color: #5a4a3a;
            line-height: 1.3;
        }

        .header-section {
            display: flex;
            
            align-items: flex-start;
            gap: 40px;
            
            margin: 0 auto 20px;
            width: min(1221.17px, 100%);
            height: min(190px, 100%);
            max-width: 1221.17px;
            max-height: 190px;
        }

    .progress-tracker {
            display: flex;
            
            position: relative;
            
            --pc-size: 100px; 
            
            width: min(743.17px, 100%);
            
            height: min(176px, calc(var(--pc-size) + 76px));
                
                
                justify-content: flex-end;
                margin-left: auto; 
                padding-right: 0;
                
                gap: 0;
            align-items: flex-start; 

        }

        
        .progress-connector {
            
            
            flex: 1 2 min(109px, max(6px, calc((100% - (4 * var(--pc-size))) / 3)));
            display: flex;
            align-items: center; 
            justify-content: center;
            
            width: min(109px, max(6px, calc((100% - (4 * var(--pc-size))) / 3)));
            height: var(--pc-size);
            min-width: 6px; 
            z-index: -1; 
            overflow: hidden; 
        }
        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            
                
                flex: 0 1 var(--pc-size);
                min-width: 0; 
                
                width: var(--pc-size);
                
                height: var(--pc-size);
            box-sizing: border-box;
            margin: 0;
            padding: 0;
                text-align: center; 
                position: relative; 
            z-index: 2;
        }

          
          .progress-meta {
                position: absolute;
                top: calc(var(--pc-size) + 6px); 
                left: 50%;
                transform: translateX(-50%);
                width: var(--pc-size);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                box-sizing: border-box;
                text-align: center;
                z-index: 2;
          }

        
        .progress-step > * {
            margin-left: auto;
            margin-right: auto;
        }

        .progress-circle {
            
            width: var(--pc-size);
            height: var(--pc-size);
            border-radius: 50%;
            background: rgba(209, 196, 160, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            
            flex: 0 1 var(--pc-size);
            min-width: 48px; 
            aspect-ratio: 1 / 1;
        }

        
        .progress-circle svg,
        .progress-circle img.progress-icon {
            width: 100%;
            height: 100%;
            display: block;
        }

        .progress-circle img.progress-icon {
            object-fit: contain;
        }

        
        @media (max-width: 900px) {
            
            .progress-tracker { --pc-size: 50px; }
        }

        @media (max-width: 480px) {
            .progress-tracker { --pc-size: 44px; }
        }

        .progress-step.active .progress-circle {
            background: rgba(203, 202, 120, 0.489);
        }

        
        .progress-column {
            display: flex;
            flex-direction: column;
            
            align-items: flex-end; 
            
            align-self: flex-start;
            
            justify-content: flex-start;
            
            margin-top: 0;
            padding-top: 0;
            width: 100%;
            gap: 8px;
            flex: 1 1 auto; ;
        }

        .progress-label {
            font-size: clamp(10px, 16px, 16px);
            text-align: center;
            line-height: 1.2;
            color: #4a3728;
            margin-top: 2px;
            display: block;
            box-sizing: border-box;
            min-height: 38.4px;
        }

        
        .progress-label,
        .progress-date {
            
            width: var(--pc-size);
            box-sizing: border-box;
            min-height: 1.2em; 
            white-space: normal; 
            overflow-wrap: anywhere;
            word-break: break-word;
            text-align: center;
        }

        .progress-date {
            color: #6b5d4f;
            
            min-height: 16px;
            text-align: center;
            font-size: clamp(10px, 12px, 14px);

        }

        .status-message {
            text-align: right;
            font-style: italic;
            color: #725134;
            margin: -20px 0 0 0;
            font-size: 24px;
        }

        .container {
            
            max-width: 1302px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .payment-container {
            background: rgba(193, 192, 150, 0.354);
            border: 1px solid rgba(0, 0, 0, 0.354);
            padding: 35px 15px 35px 60px;
            border-radius: 50px;
            position: relative;
            
            width: min(1262px, 100%);
            max-width: 1262px;
            height: min(637px, 100%);
            max-height: 637px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 23px;
            margin-bottom: 15px;
            color: #6b4423;
            font-weight: 400;
            letter-spacing: 0.5px;;
            font-family: "Slackey";
        }

        .payment-methods {
            display: grid;
            
            grid-template-columns: repeat(3, 304px);
            gap: 25px;
            margin: 0 auto 35px;
            justify-content: center; 
        }

        .payment-method {
            background: rgba(180, 170, 140, 0);
            
            width: 304px;
            height: 185px;
            padding: 20px;
            border-radius: 42px;
            border: 2px solid #5a4a3a;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-sizing: border-box;
        }

        
        @media (max-width: 980px) {
            .payment-methods {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 16px;
            }
            .payment-method {
                width: 100%;
                height: auto;
                padding: 16px;
            }
        }

        .payment-method.active {
            background: rgba(120, 130, 100, 0.7);
            border-color: #3d2f1f;
        }

        .payment-method:hover {
            background: rgba(120, 130, 100, 0.6);
        }

        .payment-icon {
            width: 50px;
            height: 50px;
            color: #4a3728;
        }

        .payment-label {
            font-size: 24px;
            font-weight: bold;
            color: #3d2f1f;
        }

        .form-row {
            display: grid;
            gap: 65px;
            margin-bottom: 25px;
        }

        .form-row-2 {
            grid-template-columns: 1fr 0.7fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 24px;
            font-weight: bold;
            color: #4a3728;
        }

        .form-group input {
            padding: 14px 20px;
            border: 2px solid #5a4a3a;
            border-radius: 25px;
            background: rgba(238, 232, 213, 0);
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #3d2f1f;
        }

        
        .w-579 { width: min(100%, 579px); height: 57px; box-sizing: border-box; }
        .w-407 { width: min(100%, 407px); height: 57px; box-sizing: border-box; }

        .form-group input:focus {
            outline: none;
            background: rgba(238, 232, 213, 0.7);
            border-color: #3d2f1f;
        }

        .payment-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 25px;
            margin-top: 0px;
            margin-right: 50px;
        }

        .total-section {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #3d2f1f;
        }

        .total-section span:last-child {
            font-size: 24px;
            margin-right: 10px;
        }

        .total-section span {
            font-size: 24px;
            margin-right: 60px;
        }

        .pay-button {
            padding: 14px 50px;
            border: 2px solid #5a4a3a;
            border-radius: 35px;
            background: rgba(193, 192, 150, 0);
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: bold;
            color: #3d2f1f;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pay-button:hover {
            background: rgba(160, 150, 120, 0.9);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Space for header, pet info, and progress tracker -->
        
        <div class="header-section">
            <div class="pet-header">
                <div class="pet-image"></div>
                <div class="pet-info">
                    <h2>Bark Twain</h2>
                    <p>Beagle</p>
                    <p>2 yrs. old</p>
                    <p>Male</p>
                </div>
            </div>
            <div class="progress-column">
                <div class="progress-tracker">
                    <div class="progress-step active">
                        <div class="progress-circle">
                            <img src="svgs/application_placed.svg" alt="Application Placed" class="progress-icon">
                        </div>
                        <div class="progress-meta">
                            <div class="progress-label">Application Placed</div>
                            <div class="progress-date">October 28, 2025</div>
                        </div>
                    </div>
                    <div class="progress-connector">
                        <svg width="100%" height="2" viewBox="0 0 100 2" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                            <line x1="0" x2="100" y1="1" y2="1" stroke="#3d2f1f" stroke-width="1" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="progress-step active">
                        <div class="progress-circle">
                            <img src="svgs/meet_and_greet.svg" alt="Meet and Greet" class="progress-icon">
                        </div>
                        <div class="progress-meta">
                            <div class="progress-label">Meet and Greet</div>
                            <div class="progress-date"></div>
                        </div>
                    </div>
                    <div class="progress-connector">
                        <svg width="100%" height="2" viewBox="0 0 100 2" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                            <line x1="0" x2="100" y1="1" y2="1" stroke="#3d2f1f" stroke-width="1" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="progress-step active">
                        <div class="progress-circle">
                            <img src="svgs/ready_for_adoption.svg" alt="Ready for Adoption" class="progress-icon">
                        </div>
                        <div class="progress-meta">
                            <div class="progress-label">Ready for Adoption</div>
                            <div class="progress-date"></div>
                        </div>

                    </div>
                    <div class="progress-connector">
                        <svg width="100%" height="2" viewBox="0 0 100 2" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                            <line x1="0" x2="100" y1="1" y2="1" stroke="#3d2f1f" stroke-width="1" stroke-linecap="round" />
                        </svg>
                    </div>
                    <div class="progress-step">
                        <div class="progress-circle">
                            <img src="svgs/adopted.svg" alt="Adopted" class="progress-icon">
                        </div>
                        <div class="progress-meta">
                            <div class="progress-label">Adopted      </div>
                            <div class="progress-date"></div>
                        </div>

                    </div>
                </div>
                <div class="status-message">Your meet-and-greet went great! Let's finalize your pet adoption.</div>
            </div>
        </div>

        <div class="payment-container">
            <h3 class="section-title">Payment Method</h3>
            
            <div class="payment-methods">
                <div class="payment-method">
                    <img src="svgs/credit_card.svg" class="payment-icon" viewBox="0 0 24 24">
                    <div class="payment-label">Credit Card</div>
                </div>
                
                <div class="payment-method">
                    <img src="svgs/gcash.svg" class="payment-icon" viewBox="0 0 24 24" fill="none">
                    <div class="payment-label">GCash</div>
                </div>
                
                <div class="payment-method">
                    <img src="svgs/bank_transfer.svg" class="payment-icon" viewBox="0 0 24 24" fill="none">
                    <div class="payment-label">Bank Transfer</div>
                </div>
            </div>

            <div class="form-row form-row-2">
                <div class="form-group">
                    <label>Card Number</label>
                    <input type="text" class="w-579" placeholder="1234 5678 9012 3456">
                </div>
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="text" class="w-407" placeholder="MM/YY">
                </div>
            </div>

            <div class="form-row form-row-2">
                <div class="form-group">
                    <label>Card Holder Name</label>
                    <input type="text" class="w-579" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>CVV</label>
                    <input type="text" class="w-407" placeholder="123">
                </div>
            </div>

            <div class="payment-footer">
                <div class="total-section">
                    <span>Total</span>
                    <span>₱1000.00</span>
                </div>
                <button class="pay-button">Pay</button>
            </div>
        </div>

        <!-- Space for footer -->
    </div>
</body>
</html>
